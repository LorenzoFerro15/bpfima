
apiVersion: bpfima.polito.it/v1alpha1
kind: Policy
metadata:
  name: policy-v1
spec:
  policy:
    enabled: true
    log_level: 1  # WARN only
    min_file_size: 0
    max_path_depth: 16

  filters:
    system_cgroups: false       # Skip system internals
    proc_sys: false             # Skip /proc and /sys
    dev: false                  # Skip /dev
    readonly_files: false       # Skip readonly opens
    small_files: false          # Skip small files
    non_executable: false       # Only track executables
    libraries: false           # Track libraries (important for integrity)
    tmp_files: false            # Skip /tmp

  actions:
    extend_tpm: false
    log_securityfs: false
    log_kernel: false          # Reduce kernel log noise
    alert_suspicious: false
    block: false
    track_container: false
    build_deps: false

  cgroup_patterns:
    - pattern: "/"
      enabled: true
      match_type: 0

  path_patterns:
    - pattern: "/proc/"
      enabled: true
      match_type: 1

  hooks:
    lsm_bprm_check_security:
      enabled: false
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0

    lsm_file_open:
      enabled: false  # Disable to reduce overhead
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0

    lsm_file_post_open:
      enabled: false
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0

    lsm_mmap_file:
      enabled: false
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0

    lsm_socket_connect:
      enabled: false
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0

    lsm_container_events:
      enabled: false
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0

    kprobe_file_open:
      enabled: false
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0
