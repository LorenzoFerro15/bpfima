
apiVersion: bpfima.polito.it/v1alpha1
kind: Policy
metadata:
  name: policy-2
spec:
  policy:
    enabled: true
    log_level: 1
    min_file_size: 0
    max_path_depth: 16

  filters:
    system_cgroups: false
    proc_sys: false
    dev: false
    readonly_files: false
    small_files: false
    non_executable: false
    libraries: false
    tmp_files: false

  actions:
    extend_tpm: false
    log_securityfs: false
    log_kernel: false
    alert_suspicious: false
    block: false
    track_container: false
    build_deps: false

  cgroup_patterns:
    - pattern: "/"
      enabled: true
      match_type: 0
    - pattern: "system.slice"
      enabled: true
      match_type: 1


  path_patterns:
    - pattern: "/dev/"
      enabled: true
      match_type: 1
    - pattern: "/tmp/"
      enabled: true
      match_type: 1
    - pattern: "/bin/"
      enabled: true
      match_type: 1

  hooks:
    lsm_bprm_check_security:
      enabled: false
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0

    lsm_file_open:
      enabled: false
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0

    lsm_file_post_open:
      enabled: false
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0

    lsm_mmap_file:
      enabled: false
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0

    lsm_socket_connect:
      enabled: false
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0

    lsm_container_events:
      enabled: false
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0

    kprobe_file_open:
      enabled: false
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0
