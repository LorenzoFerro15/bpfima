apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: {{ include "bpfima.name" . }}
    app.kubernetes.io/component: controller-cluster-role-binding
  name: {{ include "bpfima.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "bpfima.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "bpfima.fullname" . }}
  namespace: {{ .Release.Namespace }}
