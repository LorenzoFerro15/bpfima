                      maxLength: 256
                      minLength: 1
                      type: string
                  required:
                  - enabled
                  - match_type
                  - pattern
                  type: object
                maxItems: 64
                type: array
              policy:
                description: Policy configuration
                properties:
                  enabled:
                    description: Enabled controls whether BPF IMA is active
                    type: boolean
                  log_level:
                    description: LogLevel sets the logging verbosity (0=ERROR, 1=WARN,
                      2=INFO, 3=DEBUG)
                    format: int32
                    maximum: 3
                    minimum: 0
                    type: integer
                  max_path_depth:
                    description: MaxPathDepth maximum depth of file paths to track
                    format: int32
                    minimum: 1
                    type: integer
                  min_file_size:
                    description: MinFileSize minimum file size to track
                    format: int64
                    minimum: 0
                    type: integer
                required:
                - enabled
                - log_level
                type: object
              selector:
                description: Node selector - To which nodes apply the policy
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            required:
