                        minimum: 0
                        type: integer
                      enabled:
                        description: Enabled whether this hook is active
                        type: boolean
                      filter_override:
                        description: FilterOverride override global filter flags
                        format: int32
                        minimum: 0
                        type: integer
                      measure_hash:
                        description: MeasureHash whether to measure file hashes
                        type: boolean
                      track_containers:
                        description: TrackContainers whether to track container context
                        type: boolean
                    required:
                    - action_override
                    - enabled
                    - filter_override
                    - measure_hash
                    - track_containers
                    type: object
                  lsm_file_open:
                    description: LSMFileOpen configuration
                    properties:
                      action_override:
                        description: ActionOverride override global action flags
                        format: int32
                        minimum: 0
                        type: integer
                      enabled:
                        description: Enabled whether this hook is active
                        type: boolean
                      filter_override:
                        description: FilterOverride override global filter flags
                        format: int32
                        minimum: 0
                        type: integer
                      measure_hash:
                        description: MeasureHash whether to measure file hashes
                        type: boolean
                      track_containers:
                        description: TrackContainers whether to track container context
                        type: boolean
                    required:
                    - action_override
                    - enabled
                    - filter_override
                    - measure_hash
                    - track_containers
                    type: object
                  lsm_file_post_open:
                    description: LSMFilePostOpen configuration
                    properties:
                      action_override:
                        description: ActionOverride override global action flags
                        format: int32
                        minimum: 0
                        type: integer
                      enabled:
                        description: Enabled whether this hook is active
                        type: boolean
                      filter_override:
                        description: FilterOverride override global filter flags
                        format: int32
                        minimum: 0
                        type: integer
                      measure_hash:
                        description: MeasureHash whether to measure file hashes
                        type: boolean
                      track_containers:
                        description: TrackContainers whether to track container context
                        type: boolean
                    required:
                    - action_override
                    - enabled
                    - filter_override
                    - measure_hash
                    - track_containers
                    type: object
                  lsm_mmap_file:
                    description: LSMMmapFile configuration
                    properties:
                      action_override:
                        description: ActionOverride override global action flags
                        format: int32
                        minimum: 0
                        type: integer
                      enabled:
                        description: Enabled whether this hook is active
                        type: boolean
                      filter_override:
                        description: FilterOverride override global filter flags
                        format: int32
                        minimum: 0
                        type: integer
                      measure_hash:
                        description: MeasureHash whether to measure file hashes
                        type: boolean
                      track_containers:
                        description: TrackContainers whether to track container context
                        type: boolean
                    required:
                    - action_override
                    - enabled
                    - filter_override
                    - measure_hash
                    - track_containers
                    type: object
                  lsm_socket_connect:
                    description: LSMSocketConnect configuration
                    properties:
                      action_override:
                        description: ActionOverride override global action flags
                        format: int32
                        minimum: 0
                        type: integer
                      enabled:
                        description: Enabled whether this hook is active
                        type: boolean
                      filter_override:
                        description: FilterOverride override global filter flags
                        format: int32
                        minimum: 0
                        type: integer
                      measure_hash:
                        description: MeasureHash whether to measure file hashes
                        type: boolean
                      track_containers:
                        description: TrackContainers whether to track container context
                        type: boolean
                    required:
                    - action_override
                    - enabled
                    - filter_override
                    - measure_hash
                    - track_containers
                    type: object
                type: object
              path_patterns:
                description: Path ignore patterns
                items:
                  description: PatternEntry defines a single pattern for filtering
                  properties:
                    enabled:
                      description: Enabled whether this pattern is active
                      type: boolean
                    match_type:
                      description: MatchType 0=exact, 1=prefix
                      format: int32
                      maximum: 1
                      minimum: 0
                      type: integer
                    pattern:
