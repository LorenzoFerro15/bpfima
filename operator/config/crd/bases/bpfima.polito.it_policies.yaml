                        format: int32
                        minimum: 0
                        type: integer
                      enabled:
                        description: Enabled whether this hook is active
                        type: boolean
                      filter_override:
                        description: FilterOverride override global filter flags
                        format: int32
                        minimum: 0
                        type: integer
                      measure_hash:
                        description: MeasureHash whether to measure file hashes
                        type: boolean
                      track_containers:
                        description: TrackContainers whether to track container context
                        type: boolean
                    required:
                    - action_override
                    - enabled
                    - filter_override
                    - measure_hash
                    - track_containers
                    type: object
                  lsm_container_events:
