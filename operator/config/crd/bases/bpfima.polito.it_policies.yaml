              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Policy
            properties:
              actions:
                description: Action flags - What to do when an event is captured
                properties:
                  alert_suspicious:
                    description: AlertSuspicious alert on suspicious activity
                    type: boolean
                  block:
                    description: Block block the operation
                    type: boolean
                  build_deps:
                    description: BuildDeps build dependency chain
                    type: boolean
                  extend_tpm:
                    description: ExtendTPM extend measurement to TPM PCR
                    type: boolean
                  log_kernel:
                    description: LogKernel log to kernel log (dmesg)
                    type: boolean
                  log_securityfs:
                    description: LogSecurityFS log to /sys/kernel/security/bpfima/
                    type: boolean
                  track_container:
                    description: TrackContainer track per-container measurements
                    type: boolean
                required:
                - alert_suspicious
                - block
                - build_deps
                - extend_tpm
                - log_kernel
                - log_securityfs
                - track_container
                type: object
              cgroup_patterns:
                description: Cgroup ignore patterns
                items:
                  description: PatternEntry defines a single pattern for filtering
                  properties:
                    enabled:
                      description: Enabled whether this pattern is active
                      type: boolean
                    match_type:
                      description: MatchType 0=exact, 1=prefix
                      format: int32
                      maximum: 1
                      minimum: 0
                      type: integer
                    pattern:
                      description: Pattern the pattern string to match
                      maxLength: 256
                      minLength: 1
                      type: string
                  required:
                  - enabled
                  - match_type
                  - pattern
                  type: object
                maxItems: 32
                type: array
              filters:
                description: Filter flags - Control what to skip/filter out
                properties:
                  dev:
                    description: Dev filter /dev paths
                    type: boolean
                  libraries:
                    description: Libraries filter .so libraries
                    type: boolean
                  non_executable:
                    description: NonExecutable filter non-executable files
                    type: boolean
                  proc_sys:
                    description: ProcSys filter /proc, /sys paths
                    type: boolean
                  readonly_files:
                    description: ReadonlyFiles filter readonly file opens
                    type: boolean
                  small_files:
                    description: SmallFiles filter files below min_file_size
                    type: boolean
                  system_cgroups:
                    description: SystemCgroups filter system cgroups (/, init.scope)
                    type: boolean
                  tmp_files:
                    description: TmpFiles filter /tmp files
                    type: boolean
                required:
                - dev
                - libraries
                - non_executable
                - proc_sys
                - readonly_files
                - small_files
                - system_cgroups
                - tmp_files
                type: object
              hooks:
                description: Hook-specific configuration
                properties:
                  kprobe_file_open:
                    description: KprobeFileOpen configuration
                    properties:
                      action_override:
                        description: ActionOverride override global action flags
                        format: int32
                        minimum: 0
                        type: integer
                      enabled:
                        description: Enabled whether this hook is active
                        type: boolean
                      filter_override:
                        description: FilterOverride override global filter flags
                        format: int32
                        minimum: 0
                        type: integer
                      measure_hash:
                        description: MeasureHash whether to measure file hashes
                        type: boolean
                      track_containers:
                        description: TrackContainers whether to track container context
                        type: boolean
                    required:
                    - action_override
                    - enabled
                    - filter_override
                    - measure_hash
                    - track_containers
                    type: object
                  lsm_bprm_check_security:
                    description: LSMBprmCheckSecurity configuration
                    properties:
                      action_override:
