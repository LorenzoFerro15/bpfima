# Supported userspace YAML policy syntax. Kubernetes Policy CRs use a separate schema.
# Appraisal and enforcement are not implemented by the current hooks.
policy:
  enabled: true
  log_level: 1
  measure_enabled: true
  appraise_enabled: false
  enforce_enabled: false
  container_tracking: true

filters:
  cgroup_patterns:
    - "/"
    - "init.scope"
    - "system.slice"
  path_patterns:
    - "/proc/"
    - "/sys/"
    - "/dev/"
    - "/tmp/"
    - "/var/tmp/"

hooks:
  - name: "lsm_bprm_check_security"
    enabled: true
    measure: true
  - name: "lsm_file_open"
    enabled: false
    measure: false
  - name: "lsm_file_post_open"
    enabled: true
    measure: true
  - name: "lsm_mmap_file"
    enabled: true
    measure: true
  - name: "lsm_socket_connect"
    enabled: true
    measure: true
  - name: "lsm_container_events"
    enabled: true
    measure: true
  - name: "kprobe_file_open"
    enabled: false
    measure: false
