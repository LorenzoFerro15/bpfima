bpfima_policy:
  # Global enable/disable switch
  enabled: true
  
  # Logging level: 0=none, 1=errors, 2=info, 3=debug
  log_level: 2
  
  # Minimum file size to measure (in bytes, 0 = all files)
  min_file_size: 0
  
  # Maximum path depth to track
  max_path_depth: 16

  # Filter flags - what to skip/ignore
  filters:
    # Filter system cgroups (init.scope, system.slice, etc.)
    filter_system_cgroups: true
    
    # Filter /proc and /sys paths
    filter_proc_sys: true
    
    # Filter /dev paths
    filter_dev: true
    
    # Filter readonly file opens
    filter_readonly_files: false
    
    # Filter files below minimum size
    filter_small_files: false
    
    # Filter non-executable files
    filter_non_executable: false
    
    # Filter shared libraries (.so files)
    filter_libraries: false
    
    # Filter /tmp files
    filter_tmp_files: false

  actions:
    extend_tpm: true
    
    log_to_securityfs: true
    
    log_to_kernel: true
    
    alert_on_suspicious: false
    
    block_operations: false
    
    track_containers: true
    
    build_dependency_chains: true

  cgroup_ignore_patterns:
    - pattern: "/"
      match_type: exact
      enabled: true
    
    - pattern: "init.scope"
      match_type: exact
      enabled: true
    
    - pattern: "system.slice"
      match_type: exact
      enabled: true
    
    - pattern: "user.slice"
      match_type: exact
      enabled: true
   
  path_ignore_patterns:
    - pattern: "/proc/"
      match_type: prefix
      enabled: true
    
    - pattern: "/sys/"
      match_type: prefix
      enabled: true
    
    - pattern: "/dev/"
      match_type: prefix
      enabled: true

  hooks:
    lsm_bprm_check_security:
      enabled: true
      track_containers: true
      measure_hash: true

    lsm_file_open:
      enabled: true
      track_containers: false
      measure_hash: true
    
    lsm_file_post_open:
      enabled: true
      track_containers: false
      measure_hash: true
    
    lsm_mmap_file:
      enabled: true
      track_containers: false
      measure_hash: true
    
    lsm_socket_connect:
      enabled: false
      track_containers: true
      measure_hash: false
    
    lsm_container_events:
      enabled: true
      track_containers: true
      measure_hash: false
    
    kprobe_file_open:
      enabled: false 
      track_containers: false
      measure_hash: false
