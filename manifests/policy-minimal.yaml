
apiVersion: bpfima.polito.it/v1alpha1
kind: Policy
metadata:
  name: policy-v1
spec:
  policy:
    enabled: true
    log_level: 1  # WARN only
    min_file_size: 4096  # Skip tiny files
    max_path_depth: 16

  filters:
    system_cgroups: true       # Skip system internals
    proc_sys: true             # Skip /proc and /sys
    dev: true                  # Skip /dev
    readonly_files: true       # Skip readonly opens
    small_files: true          # Skip small files
    non_executable: true       # Only track executables
    libraries: false           # Track libraries (important for integrity)
    tmp_files: true            # Skip /tmp

  actions:
    extend_tpm: true
    log_securityfs: true
    log_kernel: false          # Reduce kernel log noise
    alert_suspicious: false
    block: false
    track_container: true
    build_deps: true

  cgroup_patterns:
    - pattern: "/"
      enabled: true
      match_type: 0
    - pattern: "init.scope"
      enabled: true
      match_type: 0
    - pattern: "system.slice"
      enabled: true
      match_type: 0

  path_patterns:
    - pattern: "/proc/"
      enabled: true
      match_type: 1
    - pattern: "/sys/"
      enabled: true
      match_type: 1
    - pattern: "/dev/"
      enabled: true
      match_type: 1
    - pattern: "/tmp/"
      enabled: true
      match_type: 1
    - pattern: "/var/tmp/"
      enabled: true
      match_type: 1

  hooks:
    lsm_bprm_check_security:
      enabled: true
      track_containers: true
      measure_hash: true
      filter_override: 0
      action_override: 0

    lsm_file_open:
      enabled: false  # Disable to reduce overhead
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0

    lsm_file_post_open:
      enabled: true
      track_containers: true
      measure_hash: true
      filter_override: 0
      action_override: 0

    lsm_mmap_file:
      enabled: true
      track_containers: true
      measure_hash: true
      filter_override: 0
      action_override: 0

    lsm_socket_connect:
      enabled: true
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0

    lsm_container_events:
      enabled: true
      track_containers: true
      measure_hash: true
      filter_override: 0
      action_override: 0

    kprobe_file_open:
      enabled: false
      track_containers: false
      measure_hash: false
      filter_override: 0
      action_override: 0
